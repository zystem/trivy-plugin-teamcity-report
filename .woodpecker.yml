when:
  - event: manual
  - event: pull_request
  - event: push
    branch: main
  - event: tag
    ref: refs/tags/*

steps:
  - name: test
    image: nimlang/nim:2.2.4
    commands:
      - nimble test -y

  - name: build
    image: nimlang/nim:2.2.4
    commands:
      - apt-get update && apt-get install -y --no-install-recommends musl-tools
      - nimble release -y
      - build/tests
    depends_on:
      - test

  - name: release
    image: debian:bookworm-slim
    environment:
      GH_TOKEN:
        from_secret: github_token
    commands:
      - apt-get update && apt-get install -y --no-install-recommends gh ca-certificates
      - gh release create "$CI_COMMIT_TAG" dist/*.tar.gz --verify-tag --generate-notes --repo "$CI_REPO" --title "$CI_COMMIT_TAG"
    depends_on:
      - build
    when:
      - event: tag
